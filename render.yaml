services:
  - type: web
    name: youtube-intelligence-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: REQUEST_TIMEOUT
        value: "30"

      - key: YOUTUBE_DAILY_QUOTA_BUDGET
        value: "9000"

      - key: SNAPSHOT_SYNC_ENABLED
        value: "false"

      - key: SNAPSHOT_SYNC_INTERVAL_HOURS
        value: "6"

      # Set manually in the Render dashboard - do not commit real values.
      - key: YOUTUBE_API_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
