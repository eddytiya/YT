      THESIS: Reel Oracle refuses the YouTube-reskin dashboard and the
      generic SaaS card-grid default; it reads as a classified intelligence
      briefing assembled for a decision-maker.
      OWN-WORLD: charcoal ops-room ground (#17140f), kraft-file surface
      (#d8c8a2), single oxblood stamp accent (#a3341f); Oswald condensed
      caps for mastheads/tabs/stamps, Inter for body/UI, Courier Prime for
      typed data and numerics; folder-tab nav, stamped badges, redaction-bar
      loading states, torn/perforated dividers.
      STORY: a prospective client opens the link and reads a serious,
      assembled dossier on a channel or topic - not a demo toy - then moves
      case-file by case-file (tab by tab), trusting each score because it
      arrives with investigative rigor.
      FIRST VIEWPORT: a stamped case-folder masthead naming the briefing,
      a resource gauge, a folder-tab strip for the seven pillars, opening
      directly into the Trend Radar exhibit.
      FORM: Field Intelligence Dossier - grounded direction 3 of 7 (own
      list), seed key 07034bc2.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, and DESIGN.md.
